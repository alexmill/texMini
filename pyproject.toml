[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "texmini"
dynamic = ["version"]
description = "Approachable LaTeX compiler with automatic TeX Live package installation."
readme = "PYPI.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Alex Mill" }]
keywords = ["latex", "tex", "latexmk", "bibliography"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "pygments==2.20.0",
]

[project.scripts]
texmini = "texmini.cli:main"

[project.urls]
Homepage = "https://github.com/alexmill/texMini"
Issues = "https://github.com/alexmill/texMini/issues"
Repository = "https://github.com/alexmill/texMini"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
texmini = ["runtime_manifest.json", "texmini_latexmkrc"]

[tool.setuptools.dynamic]
version = { attr = "texmini.__version__" }

[dependency-groups]
benchmark = [
    "psutil==7.2.2",
]
