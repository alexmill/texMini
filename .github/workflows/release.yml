name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != "tag" ]]; then
            echo "Release tags must be annotated." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          release_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git merge-base --is-ancestor "$release_commit" origin/main
          version="$(uv run --frozen python -c 'import texmini; print(texmini.__version__)')"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: uv run --frozen python -m unittest discover -s tests -v
      - name: Build and validate distributions
        run: |
          uv build --sdist --wheel
          uvx --from twine==6.2.0 twine check dist/*
      - name: Install-test the wheel
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/texmini-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/texmini-bin
        run: |
          uv tool install --force dist/*.whl
          test "$("$UV_TOOL_BIN_DIR/texmini" --version)" = "${{ steps.release.outputs.version }}"
      - name: Store release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  docker-smoke:
    needs: package
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            smoke_profile: full
          - platform: linux/arm64
            arch: arm64
            smoke_profile: representative
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build release candidate
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: texmini:release-candidate-${{ matrix.arch }}
          cache-from: type=gha,scope=ci-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.arch }}
      - name: Compile fixtures with adaptive package installation
        run: |
          test "$(docker run --rm texmini:release-candidate-${{ matrix.arch }} --version)" = "${{ needs.package.outputs.version }}"
          tests/smoke_docker.sh texmini:release-candidate-${{ matrix.arch }} ${{ matrix.smoke_profile }}
      - name: Verify release image ownership behavior
        if: matrix.arch == 'amd64'
        run: |
          ownership_dir="$RUNNER_TEMP/default-ownership"
          mkdir -p "$ownership_dir"
          cp tests/fixtures/simple/simple.tex "$ownership_dir/"
          docker run --rm -v "$ownership_dir:/work" texmini:release-candidate-amd64 simple.tex
          test "$(stat -c %u "$ownership_dir/simple.pdf")" = "$(id -u)"
          arbitrary_dir="$RUNNER_TEMP/arbitrary-uid"
          mkdir -p "$arbitrary_dir"
          cp tests/fixtures/simple/simple.tex "$arbitrary_dir/"
          chmod 777 "$arbitrary_dir"
          docker run --rm \
            --user 12345:12345 \
            -v "$arbitrary_dir:/work" \
            texmini:release-candidate-amd64 simple.tex
          test "$(stat -c %u "$arbitrary_dir/simple.pdf")" = 12345

  publish-pypi:
    needs: [package, docker-smoke]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/texmini
    permissions:
      id-token: write
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1

  publish-ghcr:
    needs: [package, docker-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/alexmill/texmini
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/alexmill/texMini
            org.opencontainers.image.description=Small managed TinyTeX compiler with automatic package installation
            org.opencontainers.image.licenses=MIT
      - name: Publish multi-architecture image
        id: image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: false
          cache-from: |
            type=gha,scope=ci-amd64
            type=gha,scope=ci-arm64
            type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
      - name: Attest image provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ghcr.io/alexmill/texmini
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  github-release:
    needs: [package, publish-pypi, publish-ghcr]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if state="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$state" == "false" ]]; then
              echo "GitHub Release $GITHUB_REF_NAME is already published."
              exit 0
            fi
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "texMini ${{ needs.package.outputs.version }}"
          fi
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
