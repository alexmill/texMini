name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate GitHub Actions workflows
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv run --frozen python -m unittest discover -s tests -v
      - run: uv build --sdist --wheel
      - run: uvx --from twine==6.2.0 twine check dist/*

  uv-managed-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install the built wheel
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/texmini-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/texmini-bin
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/dist"
          uv tool install --force "$RUNNER_TEMP"/dist/*.whl
      - name: Compile all engines with one fresh managed runtime
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/texmini-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/texmini-bin
          TEXMINI_TINYTEX_ROOT: ${{ runner.temp }}/texmini-runtime/TinyTeX
          TEXMINI_PACKAGE_MAP: ${{ runner.temp }}/texmini-runtime/package-map.json
        run: |
          mkdir -p "$RUNNER_TEMP/engines/pdflatex" "$RUNNER_TEMP/engines/lualatex" "$RUNNER_TEMP/engines/xelatex" "$RUNNER_TEMP/subdirectory/docs" "$RUNNER_TEMP/common" "$RUNNER_TEMP/layout"
          cp tests/fixtures/simple/simple.tex "$RUNNER_TEMP/engines/pdflatex/"
          cp tests/fixtures/simple/simple.tex "$RUNNER_TEMP/engines/lualatex/"
          cp tests/fixtures/simple/simple.tex "$RUNNER_TEMP/engines/xelatex/"
          cp tests/fixtures/simple/simple.tex "$RUNNER_TEMP/layout/paper.tex"
          cp tests/fixtures/bibliography/bibliography.tex "$RUNNER_TEMP/subdirectory/docs/paper.tex"
          cp tests/fixtures/bibliography/refs.bib "$RUNNER_TEMP/subdirectory/docs/"
          cp -R tests/fixtures/bibtex tests/fixtures/biblatex-bibtex tests/fixtures/index tests/fixtures/glossary tests/fixtures/glossary-xindy tests/fixtures/glossaries-extra tests/fixtures/nomenclature tests/fixtures/minted tests/fixtures/multifile tests/fixtures/engine-directives "$RUNNER_TEMP/common/"
          "$UV_TOOL_BIN_DIR/texmini" install-tinytex
          tex_bin=""
          for candidate in "$TEXMINI_TINYTEX_ROOT"/bin/*; do
            if [[ -x "$candidate/latexmk" ]]; then tex_bin="$candidate"; break; fi
          done
          test -n "$tex_bin"
          test -x "$tex_bin/latexmk"
          test -x "$tex_bin/pdflatex"
          PATH="$tex_bin:$PATH" tlmgr install geometry
          PATH="$tex_bin:$PATH" tlmgr remove --force geometry
          cd "$RUNNER_TEMP/engines/pdflatex"
          first_output="$("$UV_TOOL_BIN_DIR/texmini" --engine pdflatex simple.tex)"
          printf '%s\n' "$first_output"
          grep -q "Installing 1 package: geometry" <<< "$first_output"
          test -s simple.pdf
          second_output="$("$UV_TOOL_BIN_DIR/texmini" simple.tex)"
          printf '%s\n' "$second_output"
          grep -q "simple.pdf is up to date" <<< "$second_output"
          "$UV_TOOL_BIN_DIR/texmini" --clean simple.tex
          test ! -e simple.aux
          cd "$RUNNER_TEMP/engines/lualatex"
          "$UV_TOOL_BIN_DIR/texmini" --engine lualatex simple.tex
          test -s simple.pdf
          cd "$RUNNER_TEMP/engines/xelatex"
          "$UV_TOOL_BIN_DIR/texmini" --engine xelatex simple.tex
          test -s simple.pdf
          cd "$RUNNER_TEMP/subdirectory"
          "$UV_TOOL_BIN_DIR/texmini" docs/paper.tex
          test -s docs/paper.pdf
          test -s docs/paper.bbl
          test ! -e paper.pdf
          test ! -e paper.log
          subdirectory_output="$("$UV_TOOL_BIN_DIR/texmini" docs/paper.tex)"
          printf '%s\n' "$subdirectory_output"
          grep -q "docs/paper.pdf is up to date" <<< "$subdirectory_output"
          "$UV_TOOL_BIN_DIR/texmini" --clean docs/paper.tex
          test ! -e docs/paper.aux
          test ! -e docs/paper.log
          cd "$RUNNER_TEMP/common/bibtex"
          "$UV_TOOL_BIN_DIR/texmini" paper.tex
          test -s paper.bbl
          cd "$RUNNER_TEMP/common/biblatex-bibtex"
          "$UV_TOOL_BIN_DIR/texmini" paper.tex
          test -s paper.bbl
          cd "$RUNNER_TEMP/common/index"
          "$UV_TOOL_BIN_DIR/texmini" index.tex
          test -s index.ind
          test -s people.ind
          cd "$RUNNER_TEMP/common/glossary"
          "$UV_TOOL_BIN_DIR/texmini" glossary.tex
          test -s glossary.gls
          test -s glossary.acr
          cd "$RUNNER_TEMP/common/glossary-xindy"
          "$UV_TOOL_BIN_DIR/texmini" glossary.tex
          test -s glossary.gls
          cd "$RUNNER_TEMP/common/glossaries-extra"
          "$UV_TOOL_BIN_DIR/texmini" glossary.tex
          test -s glossary.gls
          cd "$RUNNER_TEMP/common/nomenclature"
          "$UV_TOOL_BIN_DIR/texmini" nomenclature.tex
          test -s nomenclature.nls
          cd "$RUNNER_TEMP/common/minted"
          if "$UV_TOOL_BIN_DIR/texmini" minted.tex 2>minted-error.txt; then exit 1; fi
          grep -q -- "--shell-escape" minted-error.txt
          "$UV_TOOL_BIN_DIR/texmini" --shell-escape minted.tex
          test -s minted.pdf
          cd "$RUNNER_TEMP/common/multifile"
          "$UV_TOOL_BIN_DIR/texmini" main.tex
          test -s build/publication.pdf
          cd "$RUNNER_TEMP/common/engine-directives"
          "$UV_TOOL_BIN_DIR/texmini" lualatex.tex
          "$UV_TOOL_BIN_DIR/texmini" xelatex.tex
          test -s lualatex.pdf
          test -s xelatex.pdf
          cd "$RUNNER_TEMP/layout"
          "$UV_TOOL_BIN_DIR/texmini" -outdir=build -auxdir=aux -jobname=publication -synctex=1 paper.tex
          test -s build/publication.pdf
          test -s aux/publication.synctex.gz || test -s build/publication.synctex.gz
          "$UV_TOOL_BIN_DIR/texmini" --clean -outdir=build -auxdir=aux -jobname=publication -synctex=1 paper.tex
          test ! -e aux/publication.synctex.gz
          test ! -e build/publication.synctex.gz
          test -s build/publication.pdf
      - name: Exercise continuous rebuilding
        if: runner.os == 'Linux'
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/texmini-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/texmini-bin
          TEXMINI_TINYTEX_ROOT: ${{ runner.temp }}/texmini-runtime/TinyTeX
          TEXMINI_PACKAGE_MAP: ${{ runner.temp }}/texmini-runtime/package-map.json
        run: uv run --frozen python tests/watch_smoke.py "$UV_TOOL_BIN_DIR/texmini" tests/fixtures/bibliography

  minimal-linux-smoke:
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install the sole Unix runtime prerequisite
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends perl
          rm -rf /var/lib/apt/lists/*
          if command -v curl; then exit 1; fi
          if command -v wget; then exit 1; fi
      - name: Install texMini with uv
        env:
          UV_TOOL_DIR: /tmp/texmini-tools
          UV_TOOL_BIN_DIR: /tmp/texmini-bin
        run: uv tool install .
      - name: Bootstrap and compile Beamer through the Python downloader
        env:
          UV_TOOL_DIR: /tmp/texmini-tools
          UV_TOOL_BIN_DIR: /tmp/texmini-bin
          TEXMINI_TINYTEX_ROOT: /tmp/texmini-runtime/TinyTeX
          TEXMINI_PACKAGE_MAP: /tmp/texmini-runtime/package-map.json
        run: |
          /tmp/texmini-bin/texmini install-tinytex
          cd tests/fixtures/beamer
          /tmp/texmini-bin/texmini slides.tex
          test -s slides.pdf

  windows-native-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Configure isolated Windows paths
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_ENV "UV_TOOL_DIR=$env:RUNNER_TEMP\texmini-tools"
          Add-Content $env:GITHUB_ENV "UV_TOOL_BIN_DIR=$env:RUNNER_TEMP\texmini-bin"
          Add-Content $env:GITHUB_ENV "TEXMINI_TINYTEX_ROOT=$env:RUNNER_TEMP\texmini path\TinyTeX"
          Add-Content $env:GITHUB_ENV "TEXMINI_PACKAGE_MAP=$env:RUNNER_TEMP\texmini path\package-map.json"
      - name: Install the built wheel
        shell: pwsh
        run: |
          uv build --wheel --out-dir "$env:RUNNER_TEMP\dist"
          uv tool install --force (Get-ChildItem "$env:RUNNER_TEMP\dist\*.whl").FullName
      - name: Bootstrap and compile in a path containing spaces
        shell: pwsh
        run: |
          $texmini = Join-Path $env:UV_TOOL_BIN_DIR "texmini.exe"
          & $texmini install-tinytex
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $project = Join-Path $env:RUNNER_TEMP "project with spaces"
          New-Item -ItemType Directory -Force $project | Out-Null
          Copy-Item tests\fixtures\simple\simple.tex $project
          Copy-Item tests\fixtures\beamer\slides.tex $project
          Copy-Item tests\fixtures\bibliography\bibliography.tex $project
          Copy-Item tests\fixtures\bibliography\refs.bib $project
          Push-Location $project
          & $texmini simple.tex
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $incremental = & $texmini simple.tex
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $incremental | Write-Output
          if ($incremental -notmatch "simple.pdf is up to date") {
            throw "Incremental rebuild did not report an up-to-date PDF"
          }
          & $texmini slides.tex
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $texmini --engine lualatex simple.tex
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $texmini --engine xelatex simple.tex
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $texmini bibliography.tex
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $texmini --clean bibliography.tex
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path simple.pdf)) { throw "simple.pdf was not created" }
          if (-not (Test-Path slides.pdf)) { throw "slides.pdf was not created" }
          if (-not (Test-Path bibliography.pdf)) { throw "bibliography.pdf was not created" }
          if (Test-Path bibliography.aux) { throw "--clean retained bibliography.aux" }
          Pop-Location
          if (-not (Test-Path "$env:TEXMINI_TINYTEX_ROOT\.texmini-runtime.json")) {
            throw "Runtime provenance metadata was not created"
          }

  docker:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            smoke_profile: full
          - platform: linux/arm64
            arch: arm64
            smoke_profile: representative
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: texmini:test
          cache-from: type=gha,scope=ci-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.arch }}
      - name: Verify CLI
        run: docker run --rm texmini:test --version
      - name: Compile with adaptive package installation
        run: tests/smoke_docker.sh texmini:test ${{ matrix.smoke_profile }}
      - name: Preserve explicit arbitrary UID behavior
        if: matrix.arch == 'amd64'
        run: |
          arbitrary_dir="$RUNNER_TEMP/arbitrary-uid"
          mkdir -p "$arbitrary_dir"
          cp tests/fixtures/simple/simple.tex "$arbitrary_dir/"
          chmod 777 "$arbitrary_dir"
          docker run --rm \
            --user 12345:12345 \
            -v "$arbitrary_dir:/work" \
            texmini:test simple.tex
          test "$(stat -c %u "$arbitrary_dir/simple.pdf")" = 12345
