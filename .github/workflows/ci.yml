name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm test
      - run: npm run pack:check

  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run python -m unittest discover -s tests -v

  npm-managed-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install packed CLI
        shell: bash
        run: npm install --global --prefix "$RUNNER_TEMP/texmini-prefix" "$RUNNER_TEMP"/*.tgz
      - name: Compile with an empty managed runtime
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEXMINI_TINYTEX_ROOT: ${{ runner.temp }}/texmini-runtime/TinyTeX
          TEXMINI_PACKAGE_MAP: ${{ runner.temp }}/texmini-runtime/package-map.json
        run: |
          export PATH="$RUNNER_TEMP/texmini-prefix/bin:$PATH"
          texmini --backend tinytex simple.tex
          test -s simple.pdf
