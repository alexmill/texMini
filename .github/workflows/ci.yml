name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate GitHub Actions workflows
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv run --frozen python -m unittest discover -s tests -v
      - run: uv build --sdist --wheel
      - run: uvx --from twine==6.2.0 twine check dist/*

  uv-managed-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install the built wheel
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/texmini-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/texmini-bin
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/dist"
          uv tool install --force "$RUNNER_TEMP"/dist/*.whl
      - name: Compile all engines with one fresh managed runtime
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/texmini-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/texmini-bin
          TEXMINI_TINYTEX_ROOT: ${{ runner.temp }}/texmini-runtime/TinyTeX
          TEXMINI_PACKAGE_MAP: ${{ runner.temp }}/texmini-runtime/package-map.json
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/engines/pdflatex" "$RUNNER_TEMP/engines/lualatex" "$RUNNER_TEMP/engines/xelatex"
          cp tests/fixtures/simple/simple.tex "$RUNNER_TEMP/engines/pdflatex/"
          cp tests/fixtures/simple/simple.tex "$RUNNER_TEMP/engines/lualatex/"
          cp tests/fixtures/simple/simple.tex "$RUNNER_TEMP/engines/xelatex/"
          cd "$RUNNER_TEMP/engines/pdflatex"
          "$UV_TOOL_BIN_DIR/texmini" --engine pdflatex simple.tex
          test -s simple.pdf
          second_output="$("$UV_TOOL_BIN_DIR/texmini" simple.tex)"
          printf '%s\n' "$second_output"
          grep -q "simple.pdf is up to date" <<< "$second_output"
          "$UV_TOOL_BIN_DIR/texmini" --clean simple.tex
          test ! -e simple.aux
          cd "$RUNNER_TEMP/engines/lualatex"
          "$UV_TOOL_BIN_DIR/texmini" --engine lualatex simple.tex
          test -s simple.pdf
          cd "$RUNNER_TEMP/engines/xelatex"
          "$UV_TOOL_BIN_DIR/texmini" --engine xelatex simple.tex
          test -s simple.pdf

  docker:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: texmini:test
          cache-from: type=gha,scope=ci-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.arch }}
      - name: Verify CLI
        run: docker run --rm texmini:test --version
      - name: Compile offline
        if: matrix.arch == 'amd64'
        run: |
          simple_fixture="$PWD/tests/fixtures/simple"
          bibliography_fixture="$PWD/tests/fixtures/bibliography"
          docker run --rm --network none \
            -v "$simple_fixture:/work" \
            texmini:test simple.tex
          docker run --rm --network none \
            -v "$bibliography_fixture:/work" \
            texmini:test bibliography.tex
          second_output="$(docker run --rm --network none \
            -v "$bibliography_fixture:/work" \
            texmini:test bibliography.tex)"
          printf '%s\n' "$second_output"
          grep -q "bibliography.pdf is up to date" <<< "$second_output"
          docker run --rm --network none \
            -v "$bibliography_fixture:/work" \
            texmini:test --clean bibliography.tex
          test -s "$simple_fixture/simple.pdf"
          test -s "$bibliography_fixture/bibliography.pdf"
          test ! -e "$bibliography_fixture/bibliography.aux"
          test "$(stat -c %u "$bibliography_fixture/bibliography.pdf")" = "$(id -u)"
      - name: Preserve explicit arbitrary UID behavior
        if: matrix.arch == 'amd64'
        run: |
          arbitrary_dir="$RUNNER_TEMP/arbitrary-uid"
          mkdir -p "$arbitrary_dir"
          cp tests/fixtures/simple/simple.tex "$arbitrary_dir/"
          chmod 777 "$arbitrary_dir"
          docker run --rm --network none \
            --user 12345:12345 \
            -v "$arbitrary_dir:/work" \
            texmini:test simple.tex
          test "$(stat -c %u "$arbitrary_dir/simple.pdf")" = 12345
